$kind: collection
description: |-
  CardHub (Card Library) example commands. CardHub is an extension of PaytestAPI and is served by the Extensions API host under /cardhub.

  Set ApiBaseUrl to the root URL of the Extensions API, with a trailing slash (for example http://localhost:8000/).
  Set MultiplexerId to the ID (GUID) of a registered multiplexer, as returned by GetData. See README.md in the repository for details.
variables:
  ApiBaseUrl: http://localhost:8000/
  MultiplexerId: ""
