$kind: http-request
description: |-
  Step 2: inside the initialized test, Robot-1 inserts the card probe, enters PIN 1234, presses OK and ejects the card probe, all in one command.
url: "{{ApiUrl}}/ExecuteSteps"
method: POST
body:
  type: json
  content: "[{\r

    \  \"target\": \"Robot-1\",\r

    \  \"AutomationCommands\": [  \r

    \  \t{\r

    \  \t\t\"Command\" : \"Insert;1;2;3;4;OK;Eject\"\r

    \  \t}\r

    \  ]\r

    }]"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status test\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Validate Result\", function () {\r

      \    var response = pm.response.json();\r

      \    pm.expect(response.result.code).to.eql(0);\r

      });"
    language: text/javascript
settings: {}
order: 2000
