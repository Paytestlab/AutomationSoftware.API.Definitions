$kind: http-request
description: |-
  Step 3: in the same test, the contact multiplexer Mux-1 selects card port 1. Shows that one test can drive several extensions.
url: "{{ApiUrl}}/ExecuteSteps"
method: POST
body:
  type: json
  content: "[{\r

    \  \"target\": \"Mux-1\",\r

    \  \"AutomationCommands\": [  \r

    \  \t{\r

    \t\t\"Version\": \"text.v1\",\r

    \  \t\t\"Command\" : \"SELECT PORT 1\"\r

    \  \t}]\r

    }]"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status test\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Validate Result\", function () {\r

      \    var response = pm.response.json();\r

      \    pm.expect(response.result.code).to.eql(0);\r

      });"
    language: text/javascript
settings: {}
order: 3000
