$kind: http-request
description: |-
  Robot-1 moves to its home position, and the card arm inserts and ejects the card probe.

  Sent with ExecuteTest, which runs initialize, the command(s) and cleanup in one call (billed as one test case).
url: "{{ApiUrl}}/ExecuteTest"
method: POST
body:
  type: json
  content: "[{\r

    \  \"target\": \"Robot-1\",\r

    \  \"AutomationCommands\": [\r

    \  \t{\r

    \  \t\t\"Command\" : \"HOME\"\r

    \  \t}\r

    \  ]\r

    }]"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status test\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Validate Result\", function () {\r

      \    var response = pm.response.json();\r

      \    pm.expect(response.result.code).to.eql(0);\r

      });"
    language: text/javascript
settings: {}
order: 1000
