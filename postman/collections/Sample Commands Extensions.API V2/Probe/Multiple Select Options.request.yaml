$kind: http-request
description: |-
  Candidate selection with several filters: Probe-1 selects the first available card that matches all of them (multiplexer, PAN, label, expiry, protocol, interface, language, issuer country and PAN sequence number).
url: "{{ApiUrl}}/ExecuteAutomation"
method: POST
body:
  type: json
  content: "{\r

    \  \"target\": \"Probe-1\",\r

    \  \"AutomationCommand\": \r

    \  \t{\r

    \  \t\t\"Command\" : \"select --mux Sierra263 --pan 5413330089604111 --label Mastercard --expired false --protocol T0 --interface contactless --language en --issuercountry USA --pansequence 1\",\r

    \        \"Format\" : \"cli\"\r

    \  \t}\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status test\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Validate Result\", function () {\r

      \    var response = pm.response.json();\r

      \    pm.expect(response.result.code).to.eql(0);\r

      });"
    language: text/javascript
settings: {}
order: 8000
