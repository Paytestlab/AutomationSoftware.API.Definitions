$kind: http-request
description: |-
  Direct (force) selection: Probe-1 selects slot 4 of the multiplexer named Sierra263. The card library tries to activate the slot even if it is empty or in error, unless another process is using it.
url: "{{ApiUrl}}/ExecuteAutomation"
method: POST
body:
  type: json
  content: "{\r

    \  \"target\": \"Probe-1\",\r

    \  \"AutomationCommand\": \r

    \  \t{\r

    \  \t\t\"Command\" : \"select --mux Sierra263 --slot 4\",\r

    \        \"Format\" : \"cli\"\r

    \  \t}\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status test\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Validate Result\", function () {\r

      \    var response = pm.response.json();\r

      \    pm.expect(response.result.code).to.eql(0);\r

      });"
    language: text/javascript
settings: {}
order: 3000
